syntax = "proto3";

package nuntius.gateway.v1;

option java_package = "dev.nuntius.gateway.proto";
option java_multiple_files = true;

// Common envelope for all WebSocket messages.
message GatewayMessage {
  // Unique message identifier.
  string id = 1;

  // Unix timestamp in milliseconds.
  string timestamp_ms = 2;

  // Exactly one payload type may be set.
  oneof payload {
    // A greeting message.
    Greeting greeting = 3;

    // A notification message.
    Notification notification = 4;

    // A notification with generated audio.
    NotifySound notify_sound = 5;
  }
}

message Greeting {
  string message = 1;
}

message Notification {
  string title = 2;
  string message = 1;
}

message NotifySound {
  string title = 1;
  string summary = 2;
  bytes audio = 3;
}
